version: '3.9'

services:

  backend:
    build: ./backend

    container_name: rag-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    environment:
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=rag_db

    depends_on:
      - mongo

  frontend:
    build: ./frontend

    container_name: rag-frontend

    ports:
      - "4321:4321"

    volumes:
      - ./frontend:/app

    depends_on:
      - backend

  mongo:
    image: mongo:7

    container_name: rag-mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: